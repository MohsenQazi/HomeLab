---
- name: Deploy Rancher Local Path Provisioner StorageClass
  hosts: control_plane
  gather_facts: false
  vars:
    manifest_url: "https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.31/deploy/local-path-storage.yaml"

  tasks:
    - name: Apply Local Path Provisioner manifest
      kubernetes.core.k8s:
        state: present
        src: "{{ manifest_url }}"

    - name: Set local-path as default StorageClass
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: local-path
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
