---
- name: Configure Cilium L2 LoadBalancer and IP Pool
  hosts: control_plane
  become: true
  tasks:
    - name: Create Cilium IP Pool
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: "cilium.io/v2alpha1"
          kind: CiliumIPPool
          metadata:
            name: external-ip-pool
            namespace: kube-system
          spec:
            blocks:
              - start: "192.168.122.200"
                stop: "192.168.122.220"

    - name: Create Cilium L2 Announcement Policy
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: "cilium.io/v2alpha1"
          kind: CiliumL2AnnouncementPolicy
          metadata:
            name: l2-policy
            namespace: kube-system
          spec:
            externalIPs: true
            loadBalancerIPs: true

    - name: Expose Hubble UI via LoadBalancer
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: hubble-ui
            namespace: kube-system
          spec:
            type: LoadBalancer
