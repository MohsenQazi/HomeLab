---
- name: Install containerd package
  ansible.builtin.package:
    name: containerd
    state: present
    update_cache: true

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Generate default containerd configuration
  ansible.builtin.shell: |
    containerd config default > /etc/containerd/config.toml
  changed_when: true

- name: Create systemd directory for containerd environment variables
  ansible.builtin.file:
    path: /etc/systemd/system/containerd.service.d
    state: directory
    mode: '0755'

- name: Set proxy environment variables for containerd
  ansible.builtin.copy:
    dest: /etc/systemd/system/containerd.service.d/http-proxy.conf
    content: |
      [Service]
      Environment="HTTP_PROXY=http://{{ proxy_host }}:{{ proxy_port }}"
      Environment="HTTPS_PROXY=http://{{ proxy_host }}:{{ proxy_port }}"
      Environment="NO_PROXY=localhost,127.0.0.1,{{ cluster_cidr }},{{ service_cidr }},.svc,.cluster.local"
    mode: '0644'
  notify: Restart containerd

- name: Configure containerd to use SystemdCgroup
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Ensure containerd is enabled and running
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
