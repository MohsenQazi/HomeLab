      - ebtables
      - gnupg
    state: present
    update_cache: true

- name: Configure APT proxy settings
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99proxy
    content: |
      Acquire::http::Proxy "http://{{ proxy_host }}:{{ proxy_port }}/";
      Acquire::https::Proxy "http://{{ proxy_host }}:{{ proxy_port }}/";
    mode: '0644'

- name: Configure APT to use Apt-Cacher-NG server on hypervisor
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/00aptproxy
    content: |
      Acquire::http::Proxy "http://{{ apt_cache_server_ip }}:3142";
    mode: '0644'
  when: use_apt_cache | default(true)
