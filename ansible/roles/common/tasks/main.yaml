---
- name: Disable SWAP (Kubernetes requirement)
  ansible.builtin.shell: |
    swapoff -a
  changed_when: false

- name: Disable SWAP in fstab (Permanent)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+.*)$'
    replace: '# \1'

- name: Create sysctl and k8s modules configuration file
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Set system-level network parameters for Passthrough
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present
    reload: true
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
    - net.ipv4.ip_forward

- name: Install baseline OS packages
  ansible.builtin.package:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - socat
      - ebtables
      - gnupg
    state: present
    update_cache: true
- name: Disable SWAP (Kubernetes requirement)
  ansible.builtin.shell: |
    swapoff -a
  changed_when: false

- name: Disable SWAP in fstab (Permanent)
